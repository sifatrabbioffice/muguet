name: Gofile Browser Extractor

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: 'Gofile URL'
        required: true
        default: 'https://gofile.io/d/pA901JJr'

jobs:
  extract-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Browser Automation to Grab Link
        env:
          GOFILE_URL: ${{ github.event.inputs.gofile_url }}
        run: |
          python3 -c "
          import asyncio
          from playwright.async_api import async_playwright
          import os

          async def main():
              url = os.environ.get('GOFILE_URL')
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  
                  print(f'Opening: {url}')
                  await page.goto(url, wait_until='networkidle')
                  
                  # Wait for download/content elements to load
                  await asyncio.sleep(5)
                  
                  # Capture all resource requests or links
                  links = []
                  page.on('request', lambda request: links.append(request.url))
                  
                  # Try clicking the download button if present
                  try:
                      download_btn = page.locator('button:has-text(\"Download\")').first
                      if await download_btn.count() > 0:
                          await download_btn.click()
                          await asyncio.sleep(3)
                  except Exception as e:
                      print(f'Click error: {e}')

                  # Print captured file links
                  print('--- Captured Direct Links ---')
                  for l in links:
                      if any(ext in l for ext in ['.zip', '.rar', '.7z', '.mp4', '.mkv', 'download']):
                          print(l)

                  await browser.close()

          asyncio.run(main())
          "
