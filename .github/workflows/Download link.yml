name: Gofile Link Fetcher & Action

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: 'Gofile URL'
        required: true
        default: 'https://gofile.io/d/pA901JJr'

jobs:
  process-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch and Extract Download Link
        env:
          GOFILE_URL: ${{ github.event.inputs.gofile_url || 'https://gofile.io/d/pA901JJr' }}
        run: |
          python3 -c "
          import requests, re

          url = '${{ github.event.inputs.gofile_url }}'
          print(f'Target URL: {url}')
          
          # Extract content ID from gofile URL
          match = re.search(r'/d/([a-zA-Z0-9]+)', url)
          if match:
              content_id = match.group(1)
              print(f'Content ID: {content_id}')
              
              # Gofile API usually requires token/content lookup
              api_url = f'https://api.gofile.io/contents/{content_id}'
              headers = {'User-Agent': 'Mozilla/5.0'}
              
              response = requests.get(api_url, headers=headers)
              print(f'API Status: {response.status_code}')
              print(f'API Response: {response.text}')
          else:
              print('Invalid Gofile URL format.')
          "
