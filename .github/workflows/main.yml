name: Build Unsigned iOS IPA (Muguet)

on:
  workflow_dispatch:
    inputs:
      game_rar_url:
        description: 'Direct Download URL for mirror.rar'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'c22dev/muguet'
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: 'aarch64-apple-ios'

      - name: Install Dependencies
        run: |
          brew install xcodegen p7zip

      - name: Download and Convert Archive
        run: |
          curl -L "${{ github.event.inputs.game_rar_url }}" -o mirror.rar
          # Extract rar file
          7z x mirror.rar -oextracted_game
          
          # Repackage into game.zip as expected by the build script
          cd extracted_game
          # Find the folder containing data/ and b/ or zip it directly
          zip -r ../game.zip .
          cd ..
          ls -lh game.zip

      - name: Build Unsigned IPA
        run: |
          chmod +x make-ios.sh
          FREE=1 CODE_SIGNING_ALLOWED=NO ./make-ios.sh game.zip --ipa

      - name: Prepare Unsigned IPA Package
        run: |
          mkdir -p output
          if [ -d "build/Muguet.app" ]; then
            mkdir -p output/Payload
            cp -r build/Muguet.app output/Payload/
            cd output
            zip -r Muguet-Unsigned.ipa Payload
            cd ..
          elif [ -f "build/Muguet.ipa" ]; then
            cp build/Muguet.ipa output/Muguet-Unsigned.ipa
          fi

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-Unsigned-IPA
          path: output/Muguet-Unsigned.ipa
